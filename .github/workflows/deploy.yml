name: Deploy to EC2 (dev_Anshu)

on:
  push:
    branches:
      - dev_Anshu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure known_hosts
        run: |
          mkdir -p /home/runner/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> /home/runner/.ssh/known_hosts
          chmod 644 /home/runner/.ssh/known_hosts

      - name: Write private key from secret
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p /home/runner/.ssh
          umask 077
          # Write key exactly as provided, stripping any CR characters
          printf '%s' "$SSH_KEY" | tr -d '\r' > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ls -l /home/runner/.ssh

      - name: Deploy to server (robust)
        run: |
          set -euo pipefail
          HOST="${{ secrets.EC2_HOST }}"
          USER="${{ secrets.EC2_USER }}"   # or use 'ubuntu' literal if you prefer
          REPO_DIR="~/Spine"
          BRANCH="dev_Anshu"
          echo "Deploying to ${USER}@${HOST}"

          # Use a login shell to ensure environment (nvm) loads; then run commands
          ssh -i /home/runner/.ssh/id_rsa -o StrictHostKeyChecking=yes -v ${USER}@${HOST} "bash -lc '
            set -e
            echo "Connected to $(hostname)"

            # Ensure repo exists
            if [ ! -d ${REPO_DIR} ]; then
              echo "Repository directory ${REPO_DIR} not found" >&2
              exit 1
            fi

            cd ${REPO_DIR}

            # Reset repo to remote branch state
            git fetch --all --prune
            git checkout ${BRANCH} || git checkout -b ${BRANCH}
            git reset --hard origin/${BRANCH}
            git clean -fdx

            # Load nvm if present and ensure Node is available
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              # Prefer an LTS Node version
              nvm install --lts >/dev/null 2>&1 || true
              nvm use --lts >/dev/null 2>&1 || true
            fi

            # Fall back to system node check
            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js not found on server. Please install Node.js (LTS) and retry." >&2
              exit 1
            fi

            # Install pm2 if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # Install deps and build
            npm ci || npm install
            if [ -f package.json ]; then
              if npm run | grep -q "build"; then
                npm run build || true
              fi
            fi

            # Start or reload app via PM2
            APP_NAME="myapp"
            START_SCRIPT="server.js"
            if [ -f dist/server.js ]; then
              START_SCRIPT="dist/server.js"
            elif [ -f build/server.js ]; then
              START_SCRIPT="build/server.js"
            fi

            if pm2 describe ${APP_NAME} >/dev/null 2>&1; then
              pm2 reload ${APP_NAME}
            else
              pm2 start ${START_SCRIPT} --name ${APP_NAME}
            fi
            pm2 save || true
            pm2 ls
          '"
        continue-on-error: false