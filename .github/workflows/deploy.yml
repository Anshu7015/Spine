name: Deploy to EC2

on:
  push:
    branches:
      - dev_Anshu   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "
            cd ~/Spine &&
            git fetch --all &&
            git reset --hard origin/dev_Anshu &&

            echo 'Installing dependencies...' &&
            npm ci &&

            echo 'Running build (fake) ...' &&
            npm run build &&

            echo 'Reloading PM2...' &&
            pm2 reload myapp || pm2 start server.js --name myapp
          "