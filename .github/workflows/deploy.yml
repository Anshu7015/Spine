name: Deploy to EC2 (dev_Anshu)

on:
  push:
    branches:
      - dev_Anshu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Debug EC2_HOST
        run: echo "HOST='${{ secrets.EC2_HOST }}'"

      - name: Configure known_hosts
        run: |
          mkdir -p /home/runner/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> /home/runner/.ssh/known_hosts
          chmod 644 /home/runner/.ssh/known_hosts

      - name: Write private key from secret
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p /home/runner/.ssh
          umask 077
          printf '%s' "$SSH_KEY" | tr -d '\r' > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ls -l /home/runner/.ssh

      - name: Deploy to server (robust)
        run: |
          set -euo pipefail
          HOST="${{ secrets.EC2_HOST }}"
          USER="${{ secrets.EC2_USER }}"
          REPO_DIR="~/Spine"
          BRANCH="dev_Anshu"
          echo "Deploying to ${USER}@${HOST}"

          ssh -i /home/runner/.ssh/id_rsa -o StrictHostKeyChecking=yes -v ${USER}@${HOST} "bash -lc '
            set -e
            echo \"Connected to \$(hostname)\"

            if [ ! -d ${REPO_DIR} ]; then
              echo \"Repository directory ${REPO_DIR} not found\" >&2
              exit 1
            fi

            cd ${REPO_DIR}

            git fetch --all --prune
            git checkout ${BRANCH} || git checkout -b ${BRANCH}
            git reset --hard origin/${BRANCH}
            git clean -fdx

            if [ -s \"$HOME/.nvm/nvm.sh\" ]; then
              . \"$HOME/.nvm/nvm.sh\"
              nvm install --lts >/dev/null 2>&1 || true
              nvm use --lts >/dev/null 2>&1 || true
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo \"Node.js not found on server. Please install Node.js (LTS).\" >&2
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            npm ci || npm install
            if [ -f package.json ]; then
              if npm run | grep -q \"build\"; then
                npm run build || true
              fi
            fi

            APP_NAME=\"myapp\"
            START_SCRIPT=\"server.js\"

            if [ -f dist/server.js ]; then
              START_SCRIPT=\"dist/server.js\"
            elif [ -f build/server.js ]; then
              START_SCRIPT=\"build/server.js\"
            fi

            if pm2 describe ${APP_NAME} >/dev/null 2>&1; then
              pm2 reload ${APP_NAME}
            else
              pm2 start ${START_SCRIPT} --name ${APP_NAME}
            fi

            pm2 save || true
            pm2 ls
          '"
        continue-on-error: false
