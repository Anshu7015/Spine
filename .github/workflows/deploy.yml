name: Deploy to EC2 (dev_Anshu)

on:
  push:
    branches:
      - dev_Anshu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Write private key from secret
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa

      - name: Deploy to server
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i /home/runner/.ssh/id_rsa -o StrictHostKeyChecking=no ${USER}@${HOST} "
            cd ~/Spine || exit 1
            git fetch --all --prune
            git reset --hard origin/dev_Anshu
            npm ci
            npm run build || true
            pm2 reload myapp || pm2 start server.js --name myapp
          "